<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Список покупок</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pattaya&family=Tangerine:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">

</head>

<body>
    <header>
        <h1>Мой список покупок 🛒</h1>
    </header>

    <main class="wrapper">
        <div class="add-row">
            <input type="text" id="shop-input" placeholder="Новая покупка..." />
            <button id="add-btn">Добавить</button>
        </div>
        <p class="error" id="error" hidden>Введите название товара</p>

        <ul id="shop-list" class="shop-list"></ul>

    </main>

    <script src="main.js"></script>
</body>

</html>
